name: Build APK

# Запускается при каждом коммите в main и вручную (кнопка Run workflow)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle ставится отдельно, поэтому gradle wrapper в репозитории не нужен
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Юнит-тесты движка, затем отладочный APK
      - name: Tests and build
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: jungle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Если тесты упали - отчёт можно скачать и посмотреть, какой именно
      - name: Save test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
